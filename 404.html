<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı · Metin Nafiz Tanır</title>
<meta name="theme-color" content="#17120f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Besley"; font-weight: 800; font-display: swap; src: url("/assets/fonts/besley-800-latin.woff2") format("woff2"); }
@font-face { font-family: "Libre Franklin"; font-weight: 400 600; font-display: swap; src: url("/assets/fonts/libre-franklin-latin.woff2") format("woff2"); }
:root { color-scheme: dark; }
html, body { margin: 0; min-height: 100%; background: #17120f; color: #f4f4f4; }
body { min-height: 100svh; display: grid; place-content: center; gap: 1.5rem; padding: 2rem 1rem; box-sizing: border-box; font: 400 1.125rem/1.5 "Libre Franklin", system-ui, sans-serif; }
p { margin: 0; color: #ddd5cf; }
.code { color: #ff6a1a; font-weight: 600; letter-spacing: 0.04em; }
h1 { margin: 0; font: 800 clamp(2.5rem, 1rem + 6vw, 5rem)/1 "Besley", Georgia, serif; }
a { color: #ff6a1a; font-weight: 600; text-underline-offset: 0.2em; }
a:hover { color: #ff8640; }
</style>
</head>
<body>
<p class="code">404</p>
<h1>Sayfa bulunamadı</h1>
<p lang="en">Page not found.</p>
<p><a href="/">Ana sayfaya dön</a></p>
</body>
</html>
